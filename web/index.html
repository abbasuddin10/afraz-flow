<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Afraz Flow – multi-tenant business management, point of sale and courier tracking.">
  <meta name="theme-color" content="#0A141E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Afraz Flow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Afraz Flow</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0A141E; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; font-family: system-ui, sans-serif; color: #F5F7FB; }
    #loading .mark { width: 84px; height: 84px; border-radius: 22px; display: block;
      margin-bottom: 18px; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45); }
    #loading .bar { width: 160px; height: 4px; border-radius: 4px; background: #1B2A3A;
      overflow: hidden; margin-top: 18px; }
    #loading .bar::after { content: ''; display: block; width: 40%; height: 100%;
      border-radius: 4px; background: #C9A25A; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
  </style>
</head>
<body>
  <div id="loading">
    <img class="mark" src="icons/Icon-192.png" alt="Afraz Flow"/>
    <div>Preparing your workspace…</div>
    <div class="bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
